# Postgres local para desarrollo y tests (no es Supabase: las migraciones crean los roles que falten).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cuidarte
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cuidarte"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - dbdata:/var/lib/postgresql/data
volumes:
  dbdata:
