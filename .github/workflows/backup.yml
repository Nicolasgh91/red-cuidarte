name: Weekly backup

# pg_dump semanal de producción, cifrado (contiene datos de salud) y guardado como artifact.
# Retención corta: el almacenamiento de artifacts del plan Free es de 500 MB.
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Instalar cliente de Postgres 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Volcado
        run: |
          set -euo pipefail
          pg_dump "$BACKUP_DATABASE_URL" --no-owner --no-privileges --format=custom --schema=public --schema=supabase_migrations --file=cuidarte.dump
      - name: Cifrar y borrar el volcado en claro
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 --output "cuidarte-$(date -u +%Y%m%d).dump.gpg" cuidarte.dump
          shred -u cuidarte.dump
      - uses: actions/upload-artifact@v4
        with:
          name: cuidarte-backup
          path: cuidarte-*.dump.gpg
          retention-days: 21
          if-no-files-found: error
