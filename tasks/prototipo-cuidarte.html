<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cuidarte+</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Cuidarte+: pausas guiadas, recursos, recordatorios, turnos, tareas y registro diario para personas que cuidan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@500;600&display=swap">
<style>
/* Layout: app shell — header + left sidebar nav (bottom tab bar on phones) + centered content column */
:root {
  --bg: #f6f4ee; --surface: #fdfcf8; --ink: #1e3a34; --text: #2a3633; --muted: #5d6b67;
  --line: #dcdcd2; --line-strong: #8fa39d; --primary: #2f5d56; --on-primary: #ffffff; --soft: #e5ece8;
  --brand: #c8493f; --note: #ede3d6; --urgent-bg: #f9ece8; --urgent-line: #c97366; --urgent-ink: #a33a2f;
  --tile-blue: #b7e3fb; --tile-green: #b8f3cc; --tile-yellow: #fdee87; --tile-orange: #fed3a6; --tile-ink: #1d2f2b;
  --wave-a: #efe1cf; --wave-b: #d9e6df;
  --ok: #276749; --ok-bg: #dcf1e4; --warn: #8a5a00; --warn-bg: #fbefcf; --bad: #a33a2f; --bad-bg: #f9e3df;
  --shadow: 0 1px 2px rgba(30, 58, 52, .06);
  --font-display: "Lora", Georgia, "Times New Roman", serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131917; --surface: #1b2320; --ink: #dfeae5; --text: #d3ddd9; --muted: #9aaba5;
    --line: #2e3a36; --line-strong: #4f625c; --primary: #79b3a6; --on-primary: #10201c; --soft: #22312c;
    --brand: #e57a6f; --note: #2c2720; --urgent-bg: #2b1c1a; --urgent-line: #8a4a41; --urgent-ink: #f0a196;
    --tile-blue: #1d3a4b; --tile-green: #1c3d2c; --tile-yellow: #45401c; --tile-orange: #4a3220; --tile-ink: #eef3f0;
    --wave-a: #3a3127; --wave-b: #24352f;
    --ok: #8fd6ae; --ok-bg: #1d3528; --warn: #f1c86a; --warn-bg: #3a3018; --bad: #f0a196; --bad-bg: #3a201d;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131917; --surface: #1b2320; --ink: #dfeae5; --text: #d3ddd9; --muted: #9aaba5;
  --line: #2e3a36; --line-strong: #4f625c; --primary: #79b3a6; --on-primary: #10201c; --soft: #22312c;
  --brand: #e57a6f; --note: #2c2720; --urgent-bg: #2b1c1a; --urgent-line: #8a4a41; --urgent-ink: #f0a196;
  --tile-blue: #1d3a4b; --tile-green: #1c3d2c; --tile-yellow: #45401c; --tile-orange: #4a3220; --tile-ink: #eef3f0;
  --wave-a: #3a3127; --wave-b: #24352f;
  --ok: #8fd6ae; --ok-bg: #1d3528; --warn: #f1c86a; --warn-bg: #3a3018; --bad: #f0a196; --bad-bg: #3a201d;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--text); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--primary); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tnum { font-variant-numeric: tabular-nums; }

.shell {
  display: grid; grid-template-columns: 196px minmax(0, 1fr); column-gap: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
.shell.bare { grid-template-columns: minmax(0, 1fr); }
.shell.bare .side { display: none; }
.top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; padding-block: 20px 28px; gap: 12px; }
.shell.bare .top { max-width: 668px; width: 100%; margin: 0 auto; }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--font-display); font-size: 1.75rem; font-weight: 500; }
.logo svg { width: 40px; height: 40px; }

.acct { position: relative; }
.acct-btn { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; color: var(--ink); font-weight: 500; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
.acct-btn:hover { background: var(--soft); }
.menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; width: min(300px, calc(100vw - 32px)); box-shadow: 0 8px 24px rgba(0,0,0,.14); z-index: 30; display: grid; gap: 2px; }
.menu a { padding: 10px 12px; border-radius: 8px; text-decoration: none; color: var(--text); }
.menu a:hover { background: var(--soft); }
.menu .who { padding: 8px 12px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.menu .who b { display: block; color: var(--ink); }
.menu .who span { color: var(--muted); font-size: .88rem; }
.menu .mlabel { padding: 10px 12px 4px; color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; border-top: 1px solid var(--line); margin-top: 4px; }
.segc { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--soft); border-radius: 10px; margin: 0 4px 4px; }
.segc button { border: 0; background: none; border-radius: 7px; padding: 7px 4px; font-size: .86rem; cursor: pointer; color: var(--text); }
.segc button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }

.side nav { display: grid; gap: 6px; align-content: start; }
.nav-link { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-radius: 10px; text-decoration: none; color: var(--muted); font-weight: 500; }
.nav-link:hover { background: var(--soft); color: var(--ink); }
.nav-link.on { background: var(--soft); color: var(--ink); }
.role-tag { margin: 18px 16px 0; font-size: .8rem; color: var(--muted); }

main { min-width: 0; padding-bottom: 64px; }
.page { max-width: 852px; margin: 0 auto; display: grid; gap: 28px; }
.page.wide { max-width: 1085px; }
.page.narrow { max-width: 712px; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); text-decoration: none; font-weight: 500; justify-self: start; background: none; border: 0; padding: 0; cursor: pointer; }
.back svg { width: 16px; height: 16px; }
.head { display: grid; gap: 6px; }
h1 { font-family: var(--font-display); font-weight: 600; color: var(--ink); font-size: clamp(2rem, 4.4vw, 3.05rem); line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: 1.07rem; margin: 0; }
h2.section { font-family: var(--font-body); font-weight: 500; color: var(--ink); font-size: 1.4rem; margin: 0; }
h2.serif { font-family: var(--font-display); font-weight: 500; color: var(--ink); font-size: 2rem; margin: 0; }
.group { display: grid; gap: 14px; }

/* Home */
.hello { color: var(--muted); font-size: 1.1rem; margin: 0; }
.home-h1 { text-transform: uppercase; }
.lead-up { text-transform: uppercase; color: var(--muted); letter-spacing: .02em; margin: 0; font-size: 1.05rem; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.tile { display: flex; align-items: center; gap: 18px; min-height: 88px; padding: 20px 22px; border-radius: var(--radius); border: 0; text-align: left; text-decoration: none; color: var(--tile-ink); font-weight: 600; letter-spacing: .02em; text-transform: uppercase; font-size: 1.08rem; cursor: pointer; transition: transform .15s, filter .15s; }
.tile:hover { filter: brightness(.97); transform: translateY(-1px); }
.tile svg.i { width: 26px; height: 26px; }
.t-blue { background: var(--tile-blue); } .t-green { background: var(--tile-green); } .t-yellow { background: var(--tile-yellow); } .t-orange { background: var(--tile-orange); }
.urgent { display: flex; align-items: center; gap: 18px; background: var(--urgent-bg); border: 1px solid var(--urgent-line); border-radius: var(--radius); padding: 20px 26px; text-align: left; cursor: pointer; width: 100%; }
.urgent strong { display: block; color: var(--urgent-ink); font-weight: 500; font-size: 1.3rem; }
.urgent span { color: var(--text); font-size: 1.1rem; }
.urgent svg { width: 40px; height: 40px; flex: none; }
.cards2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: stretch; }
.cards3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: stretch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
a.card, button.card { display: flex; align-items: center; gap: 18px; padding: 22px; text-decoration: none; color: var(--text); text-align: left; width: 100%; cursor: pointer; }
a.card:hover, button.card:hover { border-color: var(--line-strong); }
.badge { width: 58px; height: 58px; border-radius: 50%; background: var(--soft); color: var(--ink); display: grid; place-items: center; flex: none; }
.badge.sq { border-radius: 12px; }
.badge svg.i { width: 26px; height: 26px; }
.card-title { color: var(--ink); font-weight: 600; font-size: 1.12rem; margin: 0 0 4px; }
.card-text { color: var(--muted); margin: 0; font-size: 1.02rem; }
.grow { flex: 1; min-width: 0; }
.chev { color: var(--ink); }
.quote { display: flex; align-items: center; gap: 18px; border-top: 1px solid var(--line); padding-top: 30px; }
.quote p { margin: 0; font-family: var(--font-display); color: var(--primary); font-size: 1.45rem; }
.quote small { color: var(--muted); font-size: .95rem; }
.quote a { color: var(--muted); }
.disclaimer { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; color: var(--muted); font-size: .92rem; margin: 0; }
.mini-bar { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.mini-bar i { display: block; height: 100%; background: var(--primary); }

/* Resources */
.res { align-items: flex-start !important; padding: 22px 26px !important; }
.meta { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: .95rem; margin-top: 12px; }
.meta svg.i { width: 18px; height: 18px; }
.article { display: grid; gap: 18px; font-size: 1.07rem; line-height: 1.7; }
.article p, .article ul { margin: 0; }
.article ul { padding-left: 1.2em; display: grid; gap: 6px; }
.article h3 { margin: 6px 0 0; color: var(--ink); font-weight: 600; font-size: 1.15rem; }
.tag { display: inline-flex; align-items: center; gap: 6px; background: var(--soft); color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: .88rem; font-weight: 500; justify-self: start; }

/* Pause */
.outline-btn { display: flex; align-items: center; justify-content: center; gap: 10px; border: 1.5px solid var(--primary); border-radius: 12px; padding: 16px; color: var(--primary); text-decoration: none; font-weight: 500; font-size: 1.1rem; background: var(--surface); cursor: pointer; }
.outline-btn:hover { background: var(--soft); }
.outline-btn.sm { padding: 10px 16px; font-size: .98rem; }
.help { color: var(--muted); font-size: .93rem; margin: -16px 0 0; }
.rem { padding: 18px 20px !important; display: grid !important; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px !important; align-items: start !important; }
.rem .badge { grid-row: span 2; width: 50px; height: 50px; }
.rem .badge svg.i { width: 22px; height: 22px; }
.rem .grow { overflow-wrap: break-word; }
.rem .cfg { grid-column: 2; justify-self: start; }
.rem .card-title { font-size: 1.05rem; margin: 0 0 2px; }
.rem .card-text { font-size: .95rem; }
.cfg { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); font-weight: 500; font-size: .95rem; white-space: nowrap; }
.cfg svg.i { width: 16px; height: 16px; }
.guided { padding: 22px !important; }
.play { width: 62px; height: 62px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; flex: none; }
.play svg { width: 18px; height: 18px; stroke: none; }

/* Forms */
.privacy { display: flex; gap: 14px; background: var(--soft); border-radius: 12px; padding: 16px 20px; color: var(--ink); }
.privacy p { margin: 0; }
.seg { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.seg button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 15px 6px; cursor: pointer; color: var(--text); }
.seg button:hover { border-color: var(--primary); }
.seg button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 500; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.optional { color: var(--muted); font-size: .95rem; }
textarea, input[type="text"], input[type="email"], input[type="time"], input[type="date"], select { width: 100%; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; padding: 12px 14px; }
textarea { min-height: 112px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--muted); }
.primary-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; background: var(--primary); color: var(--on-primary); border: 0; border-radius: 10px; padding: 17px 20px; font-size: 1.05rem; font-weight: 500; cursor: pointer; text-decoration: none; }
.primary-btn:hover { filter: brightness(1.08); }
.primary-btn:disabled { opacity: .55; cursor: default; }
.primary-btn.auto { width: auto; justify-self: end; padding: 14px 26px; }
.primary-btn.sm { width: auto; padding: 11px 18px; font-size: .97rem; }
.err { color: var(--urgent-ink); font-size: .92rem; margin: 0; }
.records { display: grid; gap: 10px; }
.record { padding: 18px 20px; display: grid; gap: 4px; }
.record b { color: var(--ink); font-weight: 600; }
.record .vals { color: var(--muted); }
.record q { color: var(--text); quotes: "«" "»"; }
.ex { font-size: .74rem; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin-left: 8px; vertical-align: 2px; white-space: nowrap; }

.form { display: grid; gap: 18px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .lbl { color: var(--ink); font-weight: 600; font-size: .98rem; }
.field .hint { color: var(--muted); font-size: .86rem; margin: -2px 0 2px; }
.field label .light { font-weight: 400; color: var(--muted); }
.check { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--primary); flex: none; }
.check small { display: block; color: var(--muted); font-size: .87rem; margin-top: 2px; }
.danger-outline { border: 1px solid var(--urgent-line); color: var(--urgent-ink); background: var(--surface); border-radius: 10px; padding: 12px 20px; cursor: pointer; justify-self: start; }
.confirm { background: var(--urgent-bg); border: 1px solid var(--urgent-line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; }
.confirm p { margin: 0; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.danger { background: var(--urgent-ink); color: var(--surface); border: 0; border-radius: 10px; padding: 11px 18px; cursor: pointer; font-weight: 500; }
.ghost { background: none; border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 16px; cursor: pointer; color: var(--text); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.ghost:hover { background: var(--soft); }
.icon-btn { background: none; border: 0; padding: 6px; border-radius: 8px; cursor: pointer; color: var(--muted); display: inline-grid; place-items: center; text-decoration: none; }
.icon-btn:hover { background: var(--soft); color: var(--ink); }
.icon-btn svg.i { width: 18px; height: 18px; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 6px 0; width: 100%; }

.rcard { padding: 22px; display: grid; gap: 18px; }
.rhead { display: flex; gap: 14px; align-items: center; }
.rhead .badge { width: 50px; height: 50px; }
.rhead .badge svg.i { width: 22px; height: 22px; }
.rhead h3 { margin: 0; color: var(--ink); font-weight: 500; font-size: 1.3rem; }
.rhead p { margin: 0; color: var(--muted); font-size: .92rem; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.four { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: end; }
.link-btn { background: none; border: 0; padding: 0; color: var(--primary); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; justify-self: start; }
.perm { padding: 18px 20px; display: grid; gap: 14px; }
.perm p { margin: 0; color: var(--text); }
.perm button { justify-self: start; background: var(--surface); border: 1.5px solid var(--primary); color: var(--primary); border-radius: 10px; padding: 13px 22px; cursor: pointer; font-weight: 500; }
.foot-note { color: var(--muted); font-size: .9rem; margin: -10px 0 0; }

.about-lead { font-family: var(--font-display); color: var(--primary); font-size: 1.5rem; margin: 0; }
.prose { display: grid; gap: 16px; font-size: 1.08rem; line-height: 1.75; }
.prose p { margin: 0; }
.prose h2 { margin: 8px 0 -4px; color: var(--ink); font-weight: 500; font-size: 1.3rem; }
.note { background: var(--note); border-radius: 12px; padding: 14px 18px; color: var(--text); margin: 0; font-size: .97rem; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: .8rem; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.neutral { background: var(--soft); color: var(--ink); }

/* Turnos */
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.week-nav { display: flex; align-items: center; gap: 6px; }
.week-nav strong { color: var(--ink); font-weight: 600; min-width: 0; }
.week { padding: 6px 0; }
.day { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; padding: 14px 20px; border-top: 1px solid var(--line); align-items: start; }
.day:first-child { border-top: 0; }
.day.today .dname { color: var(--primary); }
.dname { color: var(--ink); font-weight: 600; padding-top: 6px; }
.dname small { display: block; color: var(--muted); font-weight: 400; font-size: .85rem; }
.shifts { display: grid; gap: 8px; }
.shift { display: flex; align-items: center; gap: 10px; background: var(--soft); border-radius: 10px; padding: 8px 8px 8px 14px; flex-wrap: wrap; }
.shift .hrs { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.shift .who { color: var(--text); }
.shift .acts { margin-left: auto; display: flex; gap: 2px; }
.empty-day { color: var(--muted); padding-top: 6px; font-size: .95rem; }

/* Tareas */
.tasks { display: grid; gap: 2px; }
.task { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-radius: 10px; }
.task:hover { background: var(--soft); }
.task input { width: 20px; height: 20px; accent-color: var(--primary); flex: none; margin: 0; }
.task .time { color: var(--muted); font-variant-numeric: tabular-nums; width: 46px; flex: none; font-size: .93rem; }
.task .txt { flex: 1; min-width: 0; }
.task.done .txt { text-decoration: line-through; color: var(--muted); }

/* Chat */
.chat-grid { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 20px; align-items: start; }
.chat { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: min(68vh, 640px); min-height: 420px; overflow: hidden; }
.chat-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); gap: 10px; }
.chat-head span { color: var(--muted); font-size: .88rem; }
.msgs { overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 86%; border-radius: 14px; padding: 11px 14px; line-height: 1.55; }
.msg p { margin: 0 0 6px; } .msg p:last-child { margin: 0; }
.msg ul { margin: 4px 0 6px; padding-left: 1.1em; }
.msg.user { align-self: flex-end; background: var(--primary); color: var(--on-primary); border-bottom-right-radius: 4px; white-space: pre-wrap; }

  function rules(toolsOk) {

${meds || "ninguna"}

Reglas:

  function chatTools(added) {
    return [
      { name: "listar_turnos", description: "Devuelve los turnos de la persona entre dos fechas (incluidas). Usalo para responder qué turnos tiene.",
        inputSchema: { type: "object", properties: { desde: { type: "string", description: "YYYY-MM-DD" }, hasta: { type: "string", description: "YYYY-MM-DD" } }, required: ["desde", "hasta"] },
        execute(input) {
          const a = dayNum(String(input.desde)), b = dayNum(String(input.hasta));
          if (!isFinite(a) || !isFinite(b)) throw new Error("Fechas inválidas, usá YYYY-MM-DD.");
          return myShifts().filter(s => dayNum(s.date) >= a && dayNum(s.date) <= b).map(s => ({ fecha: s.date, dia: fmtLong(fromIso(s.date)), desde: s.start, hasta: s.end, paciente: pName(patient(s.patientId)) }));
        } },
      { name: "agregar_turnos", description: "Agrega uno o más turnos al calendario de la persona. Devuelve los agregados y los errores (por ejemplo superposición o paciente desconocido).",
        inputSchema: { type: "object", properties: { turnos: { type: "array", items: { type: "object", properties: { paciente: { type: "string", description: "Nombre del paciente asignado" }, fecha: { type: "string", description: "YYYY-MM-DD" }, desde: { type: "string", description: "HH:MM 24 h" }, hasta: { type: "string", description: "HH:MM 24 h" } }, required: ["paciente", "fecha", "desde", "hasta"] } } }, required: ["turnos"] },
        execute(input) {
          const list = Array.isArray(input.turnos) ? input.turnos : [];
          const ok = [], errores = [];
          list.slice(0, 40).forEach(t => {
            const name = String(t.paciente || "").toLowerCase().trim();
            const p = myPatients().find(x => pName(x).toLowerCase().includes(name) || (name && name.includes(x.nombre.toLowerCase())));
            const fecha = String(t.fecha || ""), desde = String(t.desde || ""), hasta = String(t.hasta || "");
            if (!p) return errores.push(`${t.paciente}: no es un paciente asignado.`);
            if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha) || toMin(desde) == null || toMin(hasta) == null) return errores.push(`${fecha} ${desde}-${hasta}: formato inválido.`);
            if (desde === hasta) return errores.push(`${fecha}: el turno no puede durar 0 minutos.`);
            const clash = overlaps(state.meId, fecha, desde, hasta);
            if (clash) return errores.push(`${fecha} ${desde}-${hasta}: se superpone con ${clash.start}-${clash.end}.`);
            const sh = { id: uid(), caregiverId: state.meId, patientId: p.id, date: fecha, start: desde, end: hasta, source: "asistente" };
            state.shifts.push(sh); added.push(sh.id); ok.push({ fecha, desde, hasta, paciente: pName(p) });
          });
          save();
          return { agregados: ok, errores };
        } }
    ];
  }

    const input = [{ role: "user", content: rules(toolsOk) }].concat(chat.turns.slice(-14));
    try {
      const opts = { cache: false, signal: chat.ctl.signal, modelTier: "quick", onText: ({ text }) => { bot.text = text; bot.pending = false; renderMsgs(); } };
      if (toolsOk) opts.tools = chatTools(added);
      const res = await sample(input, opts);
      bot.text = res.text; bot.pending = false;
      chat.turns.push({ role: "assistant", content: res.text });
      if (res.truncated) chat.items.push({ type: "err", text: "La respuesta se cortó. Pedí algo más corto." });
    } catch (e) {
      const code = e && e.code;
      if (e && e.text) { bot.text = e.text; bot.pending = false; } else chat.items.splice(chat.items.indexOf(bot), 1);
      const msg = { not_granted: "El asistente necesita tu permiso para usar Claude. Sin ese permiso no puede responder.", sampling_disabled: "Claude no está disponible para esta cuenta.", rate_limited: "Hay muchas consultas seguidas. Probá de nuevo en un rato.", session_expired: "Tu sesión de Claude venció. Volvé a iniciar sesión.", refused: "No puedo responder eso. Probá preguntarlo de otra forma.", cancelled: "" }[code];
      if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].indexOf(code) > -1) chat.disabled = true;
      const m = msg === undefined ? "Se cortó la respuesta. Probá de nuevo." : msg;
      if (m) chat.items.push({ type: "err", text: m });
    }
    if (added.length) { const snap = {}; added.forEach(id => { const s = state.shifts.find(x => x.id === id); if (s) snap[id] = Object.assign({}, s); }); chat.items.push({ type: "card", ids: added.slice(), snap }); }
    chat.busy = false; chat.ctl = null; renderComposer();
  }

      render(true); toast(`${ic("check")} <span>Registro guardado.</span>`);
    }
    else if (kind === "profile") {
      const v = id => $("#" + id).value.trim();
      const nombre = v("p-nombre"), apellidos = v("p-apellidos"), email = v("p-email"), phone = v("p-phone"), birth = v("p-birth"), same = v("p-same");
      let ok = [setErr("p-nombre", nombre ? "" : "Escribí tu nombre."), setErr("p-apellidos", apellidos ? "" : "Escribí tus apellidos."), setErr("p-email", okMail(email) ? "" : "Revisá el mail, por ejemplo nombre@dominio.com."),
        setErr("p-phone", okPhone(phone) ? "" : "Escribí el celular con código de área, sin el 0 ni el 15."), setErr("p-birth", parseBirth(birth) ? "" : "Revisá la fecha: día/mes/año, por ejemplo 14/05/1980."),
        setErr("p-same", /^\d{2,6}$/.test(same) ? "" : "Escribí solo números, por ejemplo 107.")].every(Boolean);
      const terms = $("#p-terms").checked; $("#p-terms-err").hidden = terms; if (!terms) ok = false;
      if (!ok) { const first = f.querySelector(".err:not([hidden])"); if (first) first.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
      Object.assign(me(), { nombre, apellidos, email, telefono: phone, nacimiento: birth });
      Object.assign(state.profile, { same, gender: $("#p-gender").value, nationality: v("p-nat"), country: $("#p-country").value, barrio: v("p-barrio"), barrioWork: v("p-work"), alerts: $("#p-alerts").checked, location: $("#p-loc").checked, terms });
      save(); toast(`${ic("check")} <span>Cambios guardados.</span>`);
    }
    else if (kind === "rem") {
      let ok = true;
      ["water", "stretch"].forEach(k => {
        const on = $("#" + k + "-on").checked, from = $("#" + k + "-from").value, to = $("#" + k + "-to").value;
        const bad = on && !(toMin(to) > toMin(from)); $("#" + k + "-err").hidden = !bad; if (bad) { ok = false; return; }
        state.reminders[k] = { on, freq: +$("#" + k + "-freq").value, from: from || "08:00", to: to || "20:00" };
      });
      if (!ok) return;
      state.reminders.relax = { on: $("#relax-on").checked, times: [0, 1, 2].map(i => $("#relax-t" + i).value) };
      save(); toast(`${ic("check")} <span>Recordatorios guardados.</span>`);
    }
    else if (kind === "shift-add") {
      const pid = $("#sh-p").value, d = $("#sh-d").value, s = $("#sh-s").value, en = $("#sh-e").value, rep = +$("#sh-r").value, err = $("#sh-err");
      const fail = m => { err.hidden = false; err.textContent = m; };
      if (!pid) return fail("Primero necesitás un paciente asignado.");
      if (!d || !s || !en) return fail("Completá fecha, desde y hasta.");
      if (s === en) return fail("El turno no puede empezar y terminar a la misma hora.");
      const list = []; for (let i = 0; i < rep; i++) list.push(iso(addDays(fromIso(d), i * 7)));
      const clash = list.map(x => ({ x, c: overlaps(state.meId, x, s, en) })).find(o => o.c);
      if (clash) return fail(`Se superpone con tu turno del ${fmtLong(fromIso(clash.x))} de ${clash.c.start} a ${clash.c.end}.`);
      list.forEach(x => state.shifts.push({ id: uid(), caregiverId: state.meId, patientId: pid, date: x, start: s, end: en, source: "manual" }));
      save(); render(true); toast(`${ic("check")} <span>${list.length === 1 ? "Turno agregado." : list.length + " turnos agregados."}</span>`);
    }
    else if (kind === "task-add") {
      const text = f.elements.text.value.trim(), time = f.elements.time.value, pid = f.dataset.pid;
      if (!text) { f.elements.text.focus(); return; }
      (state.tasks[pid] = state.tasks[pid] || []).push({ id: uid(), text, time }); save(); render(true);
    }
    else if (kind === "chat") { const t = $("#chat-in"); const v = t.value.trim(); if (v && !chat.busy && !chat.disabled) { t.value = ""; sendChat(v); } }
    else if (kind === "cg-add") {
      const v = id => $("#" + id).value.trim();
      const ok = [setErr("ac-nombre", v("ac-nombre") ? "" : "Falta el nombre."), setErr("ac-apellidos", v("ac-apellidos") ? "" : "Faltan los apellidos."), setErr("ac-tel", okPhone(v("ac-tel")) ? "" : "Revisá el teléfono."),
        setErr("ac-email", okMail(v("ac-email")) ? "" : "Revisá el mail."), setErr("ac-nac", parseBirth(v("ac-nac")) ? "" : "Usá dd/mm/aaaa.")].every(Boolean);
      if (!ok) return;
      if (state.caregivers.some(c => c.email.toLowerCase() === v("ac-email").toLowerCase())) { setErr("ac-email", "Ya hay una cuenta con ese mail."); return; }
      const id = "c" + uid();
      state.caregivers.push({ id, nombre: v("ac-nombre"), apellidos: v("ac-apellidos"), telefono: v("ac-tel"), email: v("ac-email"), nacimiento: v("ac-nac"), patients: Array.from(f.querySelectorAll('input[name="ac-p"]:checked')).map(x => x.value) });
      state.devices[id] = { label: null }; save(); render(true); toast("Cuidador/a agregado. Le va a llegar un mail para activar la cuenta en la versión final.");
    }
    else if (kind === "pt-add") {
      const n = $("#ap-nombre").value.trim(), ap = $("#ap-apellido").value.trim();
      if (![setErr("ap-nombre", n ? "" : "Falta el nombre."), setErr("ap-apellido", ap ? "" : "Falta el apellido.")].every(Boolean)) return;
      const id = "p" + uid(); state.patients.push({ id, nombre: n, apellido: ap, meds: [] }); state.tasks[id] = []; state.devices[id] = { label: null };
      save(); render(true); toast("Persona cuidada agregada.");
    }
    else if (kind === "med-add") {
      const pid = f.dataset.pid, p = patient(pid), err = $("#med-err-" + pid);
      const nombre = f.elements.nombre.value.trim(), dosis = f.elements.dosis.value.trim();
      const hs = f.elements.horarios.value.split(/[,\sy]+/).map(x => x.trim()).filter(Boolean).map(x => /^\d{1,2}$/.test(x) ? pad(x) + ":00" : x);
      const bad = hs.find(h => toMin(h) == null || toMin(h) >= 1440);
      if (!nombre || !dosis || !hs.length || bad) { err.hidden = false; err.textContent = bad ? `«${bad}» no es un horario válido. Usá HH:MM, separados por coma.` : "Completá medicamento, dosis y al menos un horario."; return; }
      p.meds.push({ id: "m" + uid(), nombre, dosis, horarios: hs.map(h => { const m = toMin(h); return pad(Math.floor(m / 60)) + ":" + pad(m % 60); }).sort() }); save(); render(true);
    }
  });

  if (!location.hash) location.replace("#" + HOME[state.role]);
  render();
})();
</script>

</body></html>
